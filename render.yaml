services:
  - type: web
    name: biotasys-backend
    runtime: node
    rootDir: apps/backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biotasys-db
          property: connectionString
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: DB_MIGRATE_DATA
        value: "false"
      - key: DB_SSL
        value: "false"
      - key: DROP_SCHEMA
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM_NAME
        value: Biotasys
      - key: EMAIL_SECURE
        value: "false"
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_MAX_RETRIES
        value: "5"
      - key: AI_RETRY_DELAY_MS
        value: "30000"
      - key: AI_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: AI_BACKEND_PUBLIC_URL
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AI_CALLBACK_API_KEY
        sync: false

  - type: web
    name: biotasys-frontend
    runtime: static
    rootDir: apps/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: biotasys-db
    plan: free
    ipAllowList: []
